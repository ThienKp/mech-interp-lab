[project]
name = "mech-interp-lab"
version = "0.1.0"
description = "Experiments and projects in mechanistic interpretability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
mech-interp-lab = "mech_interp_lab:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
